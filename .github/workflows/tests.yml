name: tests

# Adopted from Fable PR #1; contracts are now an installed package dependency.
on:
  push:
    branches: [main, "lumen/**"]
  pull_request:

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install companion and contract validator
        run: python -m pip install -e .
      - name: Check exported contracts
        run: python scripts/export_contracts.py --check
      - name: Run offline suite (including Python 3.7 syntax guard)
        run: python -m unittest discover -s tests
