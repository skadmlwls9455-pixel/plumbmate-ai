[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plumbmate-ai"
version = "0.1.1a9"
description = "Local-first AI companion bridge for a life simulation game"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary — All Rights Reserved"}
authors = [{name = "PlumbMate contributors"}]
dependencies = ["jsonschema>=4.18,<5"]

[project.scripts]
plumbmate = "plumbmate.cli:main"

[tool.setuptools]
package-dir = {"" = "companion/src"}

[tool.setuptools.packages.find]
where = ["companion/src"]

[tool.setuptools.package-data]
plumbmate = ["schemas/*.json"]
